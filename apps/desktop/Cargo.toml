[package]
name = "lazy-arranger-desktop"
description = "egui desktop shell for Lazy Arranger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lazy-arranger-desktop"
path = "src/main.rs"

[dependencies]
app-commands = { path = "../../crates/app-commands" }
arranging = { path = "../../crates/arranging" }
arranger = { path = "../../crates/arranger" }
audio = { path = "../../crates/audio" }
library = { path = "../../crates/library" }
mcp = { path = "../../crates/mcp" }
midi-devices = { path = "../../crates/midi-devices" }
music-core = { path = "../../crates/music-core" }
project = { path = "../../crates/project" }
plugins = { path = "../../crates/plugins" }
plugin-host = { path = "../../crates/plugin-host" }
musicxml = { path = "../../crates/musicxml" }
score = { path = "../../crates/score" }
smf = { path = "../../crates/smf" }
style-formats = { path = "../../crates/style-formats" }
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.31"
serde.workspace = true
serde_json.workspace = true
rfd = "0.17.2"
arboard = { version = "3.7.0", default-features = false }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19.3", default-features = false }
