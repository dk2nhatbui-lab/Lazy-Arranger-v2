[package]
name = "lazy-arranger-desktop"
description = "egui desktop shell for Lazy Arranger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lazy-arranger-desktop"
path = "src/main.rs"

[dependencies]
app-commands = { path = "../../crates/app-commands" }
audio = { path = "../../crates/audio" }
music-core = { path = "../../crates/music-core" }
project = { path = "../../crates/project" }
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.31"

[lints]
workspace = true
