[package]
name = "lazy-arranger-cli"
description = "Headless CLI: import, inspect, render, record and edit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lazy-arranger"
path = "src/main.rs"

[dependencies]
app-commands = { path = "../../crates/app-commands" }
audio = { path = "../../crates/audio" }
plugins = { path = "../../crates/plugins" }
arranger = { path = "../../crates/arranger" }
arranging = { path = "../../crates/arranging" }
style-formats = { path = "../../crates/style-formats" }
clap.workspace = true
midi-devices = { path = "../../crates/midi-devices" }
music-core = { path = "../../crates/music-core" }
library = { path = "../../crates/library" }
mcp = { path = "../../crates/mcp" }
musicxml = { path = "../../crates/musicxml" }
serde_json = { workspace = true }
performance = { path = "../../crates/performance" }
project = { path = "../../crates/project" }
score = { path = "../../crates/score" }
sequencer = { path = "../../crates/sequencer" }
smf = { path = "../../crates/smf" }

[lints]
workspace = true
